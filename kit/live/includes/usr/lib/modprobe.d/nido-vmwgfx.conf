# RNFADS: il driver video vmwgfx (scheda VMSVGA di VirtualBox, VMware) con il kernel 7.0 di Ubuntu 26.04
# lascia lo schermo nero dopo GRUB nel sistema installato. Senza questo driver la console usa il framebuffer
# del firmware (simpledrm) e funziona; su un NAS la grafica accelerata non serve.
# Sta in /usr/lib/modprobe.d perché l'initramfs di Ubuntu 26.04 copia solo questa cartella (non /etc/modprobe.d)
# e vmwgfx viene caricato già dall'initramfs. In più c'è modprobe.blacklist=vmwgfx nella riga di avvio
# (/etc/default/grub.d/15-nido-video.cfg). Provato dall'utente il 31/10/2026 in VirtualBox (UEFI, VMSVGA).
blacklist vmwgfx
