# Controllo SMART di tutti i dischi (configurato dal NAS).
# Test breve ogni notte alle 2, test lungo il sabato alle 3.
# Avvisa sopra 45 °C (informazione) e 55 °C (critico) tramite le Notifiche dell'interfaccia.
DEVICESCAN -a -o on -S on -n standby,q -s (S/../.././02|L/../../6/03) -W 4,45,55 -m <nomailer> -M exec /usr/lib/nido/smartd-notify.sh
